{% load i18n %}
{% comment %}控制台消息提示（django.contrib.messages）。用法：页面里 {% include 'console/_messages.html' %}{% endcomment %}
{% if messages %}
<div class="mt-3 space-y-2">
  {% for message in messages %}
  <div role="alert" class="alert py-2 text-sm {% if message.level_tag == 'success' %}alert-success{% elif message.level_tag == 'warning' %}alert-warning{% elif message.level_tag == 'info' %}alert-info{% else %}alert-error{% endif %}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
