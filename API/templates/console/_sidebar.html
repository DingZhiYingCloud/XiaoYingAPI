{% load i18n %}
{% comment %}控制台左侧导航（菜单见 console_menu.py）：
- 宽屏（≥lg）：常驻左栏、吸附滚动；自身限高（视口高减去顶栏与留白）并在内部滚动 ——
  菜单比视口高时，鼠标停在左栏滚轮只滚侧栏，不会先把右侧内容面板带着滚。
- 小屏（<lg）：收敛为一条「控制台菜单」折叠条，默认收起，点开才占空间。
注意：这里不给 aside 加 w-full —— flex 竖排时默认 align-self:stretch 已自动撑满宽度。{% endcomment %}

<details class="collapse collapse-arrow con-panel lg:hidden">
  <summary class="collapse-title min-h-0 py-3 text-sm font-semibold">
    <span class="flex items-center gap-2">
      <i data-lucide="panel-left" class="h-4 w-4 text-primary"></i>{% trans "控制台菜单" %}
    </span>
  </summary>
  <div class="collapse-content pt-0">
    {% include 'console/_menu.html' %}
  </div>
</details>

<aside class="hidden shrink-0 lg:sticky lg:top-20 lg:block lg:max-h-[calc(100vh-6rem)] lg:w-56 lg:self-start lg:overflow-y-auto lg:pr-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
       aria-label="{% trans '控制台导航' %}">
  <nav class="con-panel p-2">
    <div class="flex items-center gap-2 px-2 pb-2 pt-1">
      <span class="flex h-6 w-6 items-center justify-center rounded-field bg-primary/10 text-primary">
        <i data-lucide="gauge" class="h-3.5 w-3.5"></i>
      </span>
      <span class="text-sm font-bold">{% trans "管理控制台" %}</span>
    </div>
    {% include 'console/_menu.html' %}
  </nav>
</aside>
