{% comment %}单行部署日志（时间戳 + 级别配色 + 超长行折叠）。用法：{% include 'console/_qqbot_log_line.html' with line=line only %}{% endcomment %}<span class="log-line block {{ line.css }}" data-level="{{ line.level }}">{% if line.ts %}<span class="text-base-content/40">[{{ line.ts }}]</span> {% endif %}{% if line.long %}<details class="inline"><summary class="cursor-pointer">{{ line.preview }}…</summary><span class="whitespace-pre-wrap">{{ line.text }}</span></details>{% else %}{{ line.text }}{% endif %}</span>
